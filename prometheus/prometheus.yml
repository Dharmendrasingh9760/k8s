global:
  scrape_interval: 15s        # how often to scrape targets
  evaluation_interval: 15s    # how often to evaluate alert rules

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Prometheus monitoring itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Host-level CPU / RAM (node_exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'

  # Per-container / per-service CPU / RAM (cadvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Application-level metrics (HTTP requests + error rates) for
  # error escalation alerting
  - job_name: 'web-service-a'
    metrics_path: /metrics
    static_configs:
      - targets: ['web-service-a:5000']
        labels:
          service: 'web-service-a'

  - job_name: 'web-service-b'
    metrics_path: /metrics
    static_configs:
      - targets: ['web-service-b:5000']
        labels:
          service: 'web-service-b'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
