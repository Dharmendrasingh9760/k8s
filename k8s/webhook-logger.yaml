# Stand-in "incident channel" endpoint inside the cluster - logs every
# alert Alertmanager sends it. Swap the Alertmanager webhook URL for a
# real Slack/PagerDuty/Opsgenie webhook in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-logger
  namespace: devops-demo
  labels:
    app: webhook-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-logger
  template:
    metadata:
      labels:
        app: webhook-logger
    spec:
      containers:
        - name: webhook-logger
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8081
          env:
            - name: HTTP_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-logger
  namespace: devops-demo
spec:
  selector:
    app: webhook-logger
  ports:
    - port: 8081
      targetPort: 8081
