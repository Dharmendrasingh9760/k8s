# ServiceMonitor tells the Prometheus Operator (from kube-prometheus-stack)
# to auto-discover and scrape these services' /metrics endpoint - no manual
# prometheus.yml editing needed, unlike the Docker Compose setup.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-service-a
  namespace: devops-demo
  labels:
    release: kube-prometheus-stack   # must match the Helm release name so
                                     # the Prometheus Operator picks it up
spec:
  selector:
    matchLabels:
      app: web-service-a
  namespaceSelector:
    matchNames:
      - devops-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      honorLabels: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: web-service-b
  namespace: devops-demo
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: web-service-b
  namespaceSelector:
    matchNames:
      - devops-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      honorLabels: true
